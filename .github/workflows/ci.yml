name: CI

# Runs the same checks a contributor runs locally. No secrets are configured:
# the tests build their own offline environment, so nothing here needs a wallet
# or a private key. Nothing in this workflow makes a paid Telegraph call.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev
